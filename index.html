<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音響モニター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #10151d;
  color: #edf2f7;
  font-family: system-ui, sans-serif;
}

main {
  max-width: 850px;
  margin: auto;
}

h1 {
  font-size: 1.4rem;
  margin-bottom: 20px;
}

.panel {
  background: #1b2430;
  border: 1px solid #344253;
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: bold;
  background: #55c2a5;
  color: #071a16;
  margin: 4px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
}

.secondary {
  background: #35465a;
  color: white;
}

.status {
  color: #a9b9ca;
  font-size: 0.9rem;
}

.range-controls {
  display: flex;
  align-items: end;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.range-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.range-field label {
  font-size: 0.85rem;
  color: #a9b9ca;
}

.range-field input {
  width: 120px;
  padding: 10px;
  border: 1px solid #526477;
  border-radius: 8px;
  background: #111923;
  color: white;
  font-size: 1rem;
}

.metrics {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.metric {
  flex: 1;
  min-width: 130px;
  background: #111923;
  padding: 12px;
  border-radius: 10px;
}

.value {
  font-size: 1.5rem;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

canvas {
  width: 100%;
  height: 330px;
  display: block;
  background: #0d131b;
  border-radius: 10px;
}

</style>
</head>

<body>

<main>

<h1>音響モニター</h1>

<div class="panel">

<div class="range-controls">

  <div class="range-field">
    <label for="minInput">下限周波数 (Hz)</label>
    <input
      type="number"
      id="minInput"
      value="1800"
      min="20"
      max="10000"
      step="10"
    >
  </div>

  <div class="range-field">
    <label for="maxInput">上限周波数 (Hz)</label>
    <input
      type="number"
      id="maxInput"
      value="2200"
      min="20"
      max="10000"
      step="10"
    >
  </div>

  <button id="applyRange">範囲を適用</button>

</div>

<button id="start">マイク開始</button>
<button id="stop" class="secondary" disabled>停止</button>
<button id="csv" class="secondary">CSV保存</button>

<p id="status" class="status"></p>

<div class="metrics">

  <div class="metric">
    <div>基本周波数</div>
    <div class="value" id="freq">— Hz</div>
  </div>

</div>

</div>

<div class="panel">

<canvas id="plot" width="1000" height="420"></canvas>

</div>

</main>

<script>

const $ = id => document.getElementById(id);

const canvas = $("plot");
const ctx = canvas.getContext("2d");

let audioCtx;
let stream;
let source;
let analyser;
let data;
let raf = null;

let history = [];
let lastSample = 0;

let minHz = 1800;
let maxHz = 2200;

const windowSec = 15;


// 周波数範囲の変更
$("applyRange").onclick = () => {

  const newMin = Number($("minInput").value);
  const newMax = Number($("maxInput").value);

  if (
    !Number.isFinite(newMin) ||
    !Number.isFinite(newMax) ||
    newMin < 20 ||
    newMax > 10000 ||
    newMin >= newMax
  ) {

    $("status").textContent =
      "周波数の上下限を正しく入力してください。";

    return;

  }

  minHz = newMin;
  maxHz = newMax;

  $("status").textContent =
    minHz + "〜" + maxHz + " Hz";

  draw(performance.now() / 1000);

};


// 基本周波数推定（YIN方式）
function yin(buf, sr) {

  const n = buf.length;
  const half = Math.floor(n / 2);

  const minTau = Math.max(
    2,
    Math.ceil(sr / maxHz)
  );

  const maxTau = Math.min(
    half - 2,
    Math.floor(sr / minHz)
  );

  if (minTau > maxTau) return null;

  const diff = new Float32Array(maxTau + 1);

  for (let tau = 1; tau <= maxTau; tau++) {

    let sum = 0;

    for (let i = 0; i < half; i++) {

      const d = buf[i] - buf[i + tau];
      sum += d * d;

    }

    diff[tau] = sum;

  }

  const cmnd = new Float32Array(maxTau + 1);

  cmnd[0] = 1;

  let running = 0;

  for (let tau = 1; tau <= maxTau; tau++) {

    running += diff[tau];

    cmnd[tau] =
      diff[tau] * tau / (running || 1);

  }

  let tau = -1;
  const threshold = 0.15;

  for (let t = minTau; t <= maxTau; t++) {

    if (cmnd[t] < threshold) {

      while (
        t + 1 <= maxTau &&
        cmnd[t + 1] < cmnd[t]
      ) {
        t++;
      }

      tau = t;
      break;

    }

  }

  if (tau < 0) return null;

  let better = tau;

  if (tau > 1 && tau < maxTau) {

    const s0 = cmnd[tau - 1];
    const s1 = cmnd[tau];
    const s2 = cmnd[tau + 1];

    const denom = 2 * (2 * s1 - s2 - s0);

    if (denom) {
      better = tau + (s2 - s0) / denom;
    }

  }

  const hz = sr / better;
  const confidence = 1 - cmnd[tau];

  if (
    hz < minHz ||
    hz > maxHz ||
    confidence < 0.55
  ) {
    return null;
  }

  return hz;

}


// グラフ描画
function draw(now) {

  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = "#0d131b";
  ctx.fillRect(0, 0, w, h);

  ctx.font = "14px system-ui";
  ctx.strokeStyle = "#293747";
  ctx.fillStyle = "#a9b9ca";
  ctx.lineWidth = 1;

  // 周波数目盛り
  for (let i = 0; i <= 4; i++) {

    const y = 20 + (h - 50) * i / 4;

    ctx.beginPath();
    ctx.moveTo(65, y);
    ctx.lineTo(w - 12, y);
    ctx.stroke();

    const v = Math.round(
      maxHz - (maxHz - minHz) * i / 4
    );

    ctx.fillText(v + " Hz", 5, y + 5);

  }

  // 時間目盛り
  for (let i = 0; i <= 5; i++) {

    const x = 65 + (w - 77) * i / 5;

    ctx.beginPath();
    ctx.moveTo(x, 20);
    ctx.lineTo(x, h - 30);
    ctx.stroke();

    ctx.fillText(
      (i * 3) + "s",
      x - 10,
      h - 8
    );

  }

  const cutoff = now - windowSec;

  // 直近15秒のデータ
  const visibleHistory = history.filter(
    p =>
      p.t >= cutoff &&
      p.hz >= minHz &&
      p.hz <= maxHz
  );

  // グラフ領域内に描画
  ctx.save();

  ctx.beginPath();
  ctx.rect(
    65,
    20,
    w - 77,
    h - 50
  );
  ctx.clip();

  ctx.strokeStyle = "#55c2a5";
  ctx.lineWidth = 3;
  ctx.beginPath();

  let started = false;

  for (const p of visibleHistory) {

    const x =
      65 + (w - 77) *
      (p.t - cutoff) / windowSec;

    const y =
      20 + (h - 50) *
      (maxHz - p.hz) / (maxHz - minHz);

    if (!started) {

      ctx.moveTo(x, y);
      started = true;

    } else {

      ctx.lineTo(x, y);

    }

  }

  ctx.stroke();

  ctx.restore();

}


// リアルタイム解析
function tick() {

  if (!analyser) return;

  analyser.getFloatTimeDomainData(data);

  const now = performance.now() / 1000;

  if (now - lastSample > 0.12) {

    lastSample = now;

    const result = yin(
      data,
      audioCtx.sampleRate
    );

    if (result !== null) {

      history.push({
        t: now,
        hz: result
      });

      $("freq").textContent =
        result.toFixed(1) + " Hz";

    } else {

      $("freq").textContent = "— Hz";

    }

  }

  draw(now);

  raf = requestAnimationFrame(tick);

}


// マイク開始
$("start").onclick = async () => {

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }

    });

    audioCtx = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    await audioCtx.resume();

    source =
      audioCtx.createMediaStreamSource(stream);

    analyser =
      audioCtx.createAnalyser();

    analyser.fftSize = 4096;

    data = new Float32Array(
      analyser.fftSize
    );

    source.connect(analyser);

    $("status").textContent =
      "測定中";

    $("start").disabled = true;
    $("stop").disabled = false;

    tick();

  } catch (e) {

    $("status").textContent =
      "マイクを開始できません：" + e.message;

  }

};


// 停止
$("stop").onclick = () => {

  if (raf) {
    cancelAnimationFrame(raf);
  }

  raf = null;

  if (stream) {

    stream.getTracks().forEach(
      t => t.stop()
    );

  }

  if (source) {
    source.disconnect();
  }

  if (audioCtx) {
    audioCtx.close();
  }

  analyser = null;

  $("start").disabled = false;
  $("stop").disabled = true;

  $("status").textContent = "停止中";

};


// CSV保存
$("csv").onclick = () => {

  const rows = [
    "elapsed_seconds,frequency_hz"
  ];

  if (history.length) {

    const origin = history[0].t;

    history.forEach(p => {

      rows.push(
        (p.t - origin).toFixed(3) +
        "," +
        p.hz.toFixed(2)
      );

    });

  }

  const blob = new Blob(
    ["\ufeff" + rows.join("\n")],
    {
      type: "text/csv;charset=utf-8"
    }
  );

  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = "frequency-log.csv";

  a.click();

  URL.revokeObjectURL(a.href);

};


// 初期表示
draw(0);

</script>

</body>
</html>
